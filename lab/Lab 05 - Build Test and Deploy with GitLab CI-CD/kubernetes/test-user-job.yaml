apiVersion: batch/v1
kind: Job
metadata:
  name: provision-e2e-user
  namespace: network-devops
  labels: {app: network-monitor, purpose: acceptance-test}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app: network-monitor, purpose: acceptance-test}
    spec:
      restartPolicy: Never
      containers:
        - name: provision-user
          image: network-monitor-app:lab04
          imagePullPolicy: IfNotPresent
          command: [python, -c]
          args:
            - |
              import os
              from app import create_app
              from app.models import User, db

              app = create_app()
              with app.app_context():
                  username = os.environ["E2E_USERNAME"].strip().lower()
                  password = os.environ["E2E_PASSWORD"]
                  user = User.query.filter_by(username=username).first()
                  if user is None:
                      user = User(username=username, is_admin=False)
                      db.session.add(user)
                  user.is_admin = False
                  user.set_password(password)
                  db.session.commit()
                  print("Acceptance-test user is ready; no credential value was printed.")
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: DATABASE_URL}}
            - name: FLASK_SECRET_KEY
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: FLASK_SECRET_KEY}}
            - name: INVENTORY_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: INVENTORY_ENCRYPTION_KEY}}
            - name: E2E_USERNAME
              valueFrom: {secretKeyRef: {name: e2e-test-credentials, key: username}}
            - name: E2E_PASSWORD
              valueFrom: {secretKeyRef: {name: e2e-test-credentials, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: temporary-files
          emptyDir: {medium: Memory, sizeLimit: 32Mi}

