input {
  beats { port => 5044 }
}

filter {
  # Preserve routing intent before the JSON filter replaces the outer
  # Filebeat message with the application's inner message field.
  if [message] =~ /"event\.dataset":"network_monitor\.synthetic"/ {
    mutate { add_tag => ["route_network_monitor_synthetic"] }
  }
  if [message] =~ /^\s*\{/ {
    json { source => "message" skip_on_invalid_json => true }
  }
  mutate {
    add_field => { "observer.type" => "course-elastic-stack" }
  }
}

output {
  if "route_network_monitor_synthetic" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-monitor-synthetic-%{+YYYY.MM.dd}" }
  } else if ([event][dataset] =~ /^network_monitor\./) or ([event.dataset] =~ /^network_monitor\./) {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-monitor-logs-%{+YYYY.MM.dd}" }
  } else if ([event][dataset] =~ /^kubernetes\./) or ([event.dataset] =~ /^kubernetes\./) {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-metrics-%{+YYYY.MM.dd}" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-logs-%{+YYYY.MM.dd}" }
  }
}
