apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-config
  namespace: network-devops
spec:
  replicas: 1
  selector:
    matchLabels: {app: network-config, tier: config}
  template:
    metadata:
      labels: {app: network-config, tier: config}
    spec:
      containers:
        - name: config-tier
          image: network-config:lab08
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - secretRef: {name: network-config-runtime}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: network-config
  namespace: network-devops
spec:
  type: NodePort
  selector: {app: network-config, tier: config}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30089
