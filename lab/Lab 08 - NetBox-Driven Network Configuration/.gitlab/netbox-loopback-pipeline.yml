stages:
  - validate-netbox-event
  - terraform-dev
  - configure-dev
  - verify-dev
  - configure-production
  - verify-production
  - cleanup-dev

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR/.ansible/collections"
  ANSIBLE_CONFIG: "$CI_PROJECT_DIR/automation/ansible/ansible.cfg"
  TERRAFORM_VERSION: "1.16.3"
  TERRAFORM_BIN: "$CI_PROJECT_DIR/.tools/terraform"

.netbox-pipeline-job:
  before_script:
    - test "$CI_PIPELINE_SOURCE" = "trigger"
    - test "$NETBOX_ACTION" = "provision_loopback"
    - mkdir -p build

.ansible-pipeline-job:
  extends: .netbox-pipeline-job
  cache:
    key: lab8-ansible-python
    paths: [.cache/pip]
  before_script:
    - test "$CI_PIPELINE_SOURCE" = "trigger"
    - test "$NETBOX_ACTION" = "provision_loopback"
    - mkdir -p build "$ANSIBLE_COLLECTIONS_PATH"
    - python3 -m venv .ansible-venv
    - .ansible-venv/bin/python -m pip install --disable-pip-version-check -r automation/requirements-python.txt
    - .ansible-venv/bin/ansible-galaxy collection install -p "$ANSIBLE_COLLECTIONS_PATH" -r automation/requirements.yml
    - .ansible-venv/bin/ansible-playbook --version

.terraform-pipeline-job:
  extends: .netbox-pipeline-job
  cache:
    key: "lab8-terraform-$TERRAFORM_VERSION"
    paths: [.tools/terraform]
  before_script:
    - test "$CI_PIPELINE_SOURCE" = "trigger"
    - test "$NETBOX_ACTION" = "provision_loopback"
    - mkdir -p build
    - sh automation/scripts/install_terraform.sh

validate-netbox-event:
  extends: .netbox-pipeline-job
  stage: validate-netbox-event
  script:
    - test -n "$FLASK_SECRET_KEY"
    - test -n "$NETBOX_ROUTER_USERNAME"
    - test -n "$NETBOX_ROUTER_PASSWORD"
    - test -n "$NETBOX_ROUTER_NAME"
    - minikube update-context --profile network-devops
    - export NETWORK_MONITOR_URL="$(minikube service network-monitor-web -n network-devops --profile network-devops --url | head -n 1)"
    - test -n "$NETWORK_MONITOR_URL"
    - python3 automation/scripts/netbox_loopbacks.py
  artifacts:
    paths: [build/netbox-loopbacks.json]
    expire_in: 1 day

create-c8000v-development:
  extends: .terraform-pipeline-job
  stage: terraform-dev
  resource_group: cml-lab8-development
  script:
    - test -n "$CML2_ADDRESS"
    - test -n "$CML2_TOKEN"
    - printf '%s\n' "${CML2_SKIP_VERIFY:-false}" | grep -Eq '^(true|false)$'
    - test -n "$TF_VAR_c8000v_image_definition"
    - test -n "$TF_VAR_dev_router_ip"
    - test -n "$TF_VAR_dev_default_gateway"
    - python3 -c 'import ipaddress,os; interface=ipaddress.ip_interface(os.environ["TF_VAR_dev_router_ip"]); gateway=ipaddress.ip_address(os.environ["TF_VAR_dev_default_gateway"]); assert interface.version == gateway.version == 4 and gateway in interface.network and interface.ip not in {interface.network.network_address, interface.network.broadcast_address}'
    - test -n "$TF_VAR_dev_username"
    - test -n "$TF_VAR_dev_password"
    - export TF_VAR_address="$CML2_ADDRESS"
    - export TF_VAR_token="$CML2_TOKEN"
    - export TF_VAR_skip_verify="${CML2_SKIP_VERIFY:-false}"
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/lab8-${CI_PIPELINE_ID}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="$CI_JOB_TOKEN"
    - export TF_HTTP_LOCK_METHOD="POST"
    - export TF_HTTP_UNLOCK_METHOD="DELETE"
    - export TF_HTTP_RETRY_WAIT_MIN="5"
    - '"$TERRAFORM_BIN" -chdir=automation/terraform init -input=false'
    - '"$TERRAFORM_BIN" -chdir=automation/terraform apply -auto-approve -input=false'
    - '"$TERRAFORM_BIN" -chdir=automation/terraform output -raw dev_router_ip > "$CI_PROJECT_DIR/build/dev-router-ip"'
    - test -s build/dev-router-ip
    - DEV_ROUTER_IP="$(cat build/dev-router-ip)" python3 automation/scripts/wait_for_restconf.py 600
  artifacts:
    when: always
    access: developer
    paths: [build/dev-router-ip]
    expire_in: 1 day

configure-c8000v-development:
  extends: .ansible-pipeline-job
  stage: configure-dev
  resource_group: cml-lab8-development
  script:
    - export DEV_ROUTER_IP="$(cat build/dev-router-ip)"
    - python3 automation/scripts/write_ansible_inventory.py dev build/dev-inventory.json
    - .ansible-venv/bin/ansible-playbook -i build/dev-inventory.json automation/ansible/configure-loopbacks.yml -e @build/netbox-loopbacks.json
  artifacts:
    access: developer
    paths: [build/dev-router-ip, build/netbox-loopbacks.json]
    expire_in: 1 day

verify-c8000v-development:
  extends: .ansible-pipeline-job
  stage: verify-dev
  resource_group: cml-lab8-development
  script:
    - export DEV_ROUTER_IP="$(cat build/dev-router-ip)"
    - python3 automation/scripts/write_ansible_inventory.py dev build/dev-inventory.json
    - .ansible-venv/bin/ansible-playbook -i build/dev-inventory.json automation/ansible/verify-loopbacks.yml -e @build/netbox-loopbacks.json

configure-production-router:
  extends: .ansible-pipeline-job
  stage: configure-production
  environment: {name: production/learners-router}
  resource_group: lab-router-production
  script:
    - test -n "$PROD_ROUTER_HOST"
    - test -n "$PROD_ROUTER_USERNAME"
    - test -n "$PROD_ROUTER_PASSWORD"
    - printf '%s\n' "${PROD_ROUTER_RESTCONF_PORT:-443}" | grep -Eq '^[0-9]+$'
    - test "${PROD_ROUTER_RESTCONF_PORT:-443}" -ge 1
    - test "${PROD_ROUTER_RESTCONF_PORT:-443}" -le 65535
    - python3 automation/scripts/write_ansible_inventory.py production build/prod-inventory.json
    - .ansible-venv/bin/ansible-playbook -i build/prod-inventory.json automation/ansible/configure-loopbacks.yml -e @build/netbox-loopbacks.json
  artifacts:
    access: developer
    paths: [build/netbox-loopbacks.json]
    expire_in: 1 day

verify-production-router:
  extends: .ansible-pipeline-job
  stage: verify-production
  environment: {name: production/learners-router}
  resource_group: lab-router-production
  script:
    - printf '%s\n' "${PROD_ROUTER_RESTCONF_PORT:-443}" | grep -Eq '^[0-9]+$'
    - test "${PROD_ROUTER_RESTCONF_PORT:-443}" -ge 1
    - test "${PROD_ROUTER_RESTCONF_PORT:-443}" -le 65535
    - python3 automation/scripts/write_ansible_inventory.py production build/prod-inventory.json
    - .ansible-venv/bin/ansible-playbook -i build/prod-inventory.json automation/ansible/verify-loopbacks.yml -e @build/netbox-loopbacks.json

destroy-c8000v-development:
  extends: .terraform-pipeline-job
  stage: cleanup-dev
  resource_group: cml-lab8-development
  script:
    - test -n "$CML2_ADDRESS"
    - test -n "$CML2_TOKEN"
    - printf '%s\n' "${CML2_SKIP_VERIFY:-false}" | grep -Eq '^(true|false)$'
    - export TF_VAR_address="$CML2_ADDRESS"
    - export TF_VAR_token="$CML2_TOKEN"
    - export TF_VAR_skip_verify="${CML2_SKIP_VERIFY:-false}"
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/lab8-${CI_PIPELINE_ID}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="$CI_JOB_TOKEN"
    - export TF_HTTP_LOCK_METHOD="POST"
    - export TF_HTTP_UNLOCK_METHOD="DELETE"
    - export TF_HTTP_RETRY_WAIT_MIN="5"
    - '"$TERRAFORM_BIN" -chdir=automation/terraform init -input=false'
    - '"$TERRAFORM_BIN" -chdir=automation/terraform destroy -auto-approve -input=false'
