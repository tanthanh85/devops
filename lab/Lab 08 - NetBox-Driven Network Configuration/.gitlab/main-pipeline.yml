stages:
  - test
  - build
  - deploy
  - verify
  - post-deployment-test
  - cleanup

default:
  tags: [lab8, minikube]
  interruptible: true

.main-pipeline-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  KUBE_NAMESPACE: "network-devops"
  MYSQL_DATABASE: "network_monitor"
  MYSQL_USER: "network_app"
  APP_IMAGE: "network-monitor-app:lab08-$CI_COMMIT_SHORT_SHA"
  WEB_IMAGE: "network-monitor-web:lab08-$CI_COMMIT_SHORT_SHA"
  SYNTHETIC_IMAGE: "network-monitor-synthetic:lab08-$CI_COMMIT_SHORT_SHA"
  CONFIG_IMAGE: "network-config:lab08-$CI_COMMIT_SHORT_SHA"

unit-test:
  extends: .main-pipeline-job
  stage: test
  cache:
    key: lab8-python-dependencies
    paths: [.cache/pip]
  script:
    - python3 -m venv .ci-venv
    - .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
    - .ci-venv/bin/python -m pytest -q

build-images:
  extends: .main-pipeline-job
  stage: build
  script:
    - minikube status --profile network-devops
    - eval "$(minikube docker-env --profile network-devops --shell bash)"
    - docker build --pull -t "$APP_IMAGE" -f app/Dockerfile .
    - docker build --pull -t "$WEB_IMAGE" -f web/Dockerfile .
    - docker build --pull -t "$SYNTHETIC_IMAGE" -f synthetic/Dockerfile synthetic
    - docker build --pull -t "$CONFIG_IMAGE" -f config-tier/Dockerfile .

deploy-minikube:
  extends: .main-pipeline-job
  stage: deploy
  environment: {name: course/minikube}
  resource_group: course-minikube
  script:
    - test -n "$MYSQL_PASSWORD"
    - test -n "$MYSQL_ROOT_PASSWORD"
    - test -n "$FLASK_SECRET_KEY"
    - test -n "$INVENTORY_ENCRYPTION_KEY"
    - test -n "$LOGSTASH_HOST"
    - test -n "$NETBOX_WEBHOOK_TOKEN"
    - test -n "$GITLAB_TRIGGER_TOKEN"
    - test -n "$GITLAB_PROJECT_ID"
    - test -n "$NETBOX_URL"
    - test -n "$NETBOX_API_TOKEN"
    - test -n "$NETBOX_ROUTER_USERNAME"
    - test -n "$NETBOX_ROUTER_PASSWORD"
    - minikube update-context --profile network-devops
    - kubectl apply -f kubernetes/namespace.yaml
    - export DATABASE_URL="mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@network-monitor-db:3306/${MYSQL_DATABASE}"
    - kubectl -n "$KUBE_NAMESPACE" create secret generic network-monitor-runtime --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" --from-literal=MYSQL_USER="$MYSQL_USER" --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" --from-literal=DATABASE_URL="$DATABASE_URL" --from-literal=FLASK_SECRET_KEY="$FLASK_SECRET_KEY" --from-literal=INVENTORY_ENCRYPTION_KEY="$INVENTORY_ENCRYPTION_KEY" --from-literal=SESSION_COOKIE_SECURE=false --from-literal=NETBOX_URL="$NETBOX_URL" --from-literal=NETBOX_API_TOKEN="$NETBOX_API_TOKEN" --from-literal=NETBOX_SKIP_TLS_VERIFY="${NETBOX_SKIP_TLS_VERIFY:-false}" --from-literal=NETBOX_ROUTER_USERNAME="$NETBOX_ROUTER_USERNAME" --from-literal=NETBOX_ROUTER_PASSWORD="$NETBOX_ROUTER_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f kubernetes/mysql.yaml
    - kubectl -n "$KUBE_NAMESPACE" rollout status statefulset/network-monitor-db --timeout=240s
    - 'sed "s|image: network-monitor-app:lab08|image: $APP_IMAGE|" kubernetes/app.yaml | kubectl apply -f -'
    - 'sed "s|image: network-monitor-web:lab08|image: $WEB_IMAGE|" kubernetes/web.yaml | kubectl apply -f -'
    - kubectl -n "$KUBE_NAMESPACE" create configmap observability-endpoints --from-literal=LOGSTASH_HOST="$LOGSTASH_HOST" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f kubernetes/filebeat.yaml
    - kubectl apply -f kubernetes/metricbeat.yaml
    - kubectl -n "$KUBE_NAMESPACE" rollout restart daemonset/filebeat daemonset/metricbeat
    - kubectl -n "$KUBE_NAMESPACE" rollout restart deployment/metricbeat-state
    - 'sed "s|image: network-monitor-synthetic:lab08|image: $SYNTHETIC_IMAGE|" kubernetes/synthetic-monitor.yaml | kubectl apply -f -'
    - test -n "$NETBOX_ROUTER_NAME"
    - kubectl -n "$KUBE_NAMESPACE" create secret generic network-config-runtime --from-literal=NETBOX_WEBHOOK_TOKEN="$NETBOX_WEBHOOK_TOKEN" --from-literal=NETBOX_ROUTER_NAME="$NETBOX_ROUTER_NAME" --from-literal=GITLAB_URL="${CI_SERVER_URL}" --from-literal=GITLAB_PROJECT_ID="$GITLAB_PROJECT_ID" --from-literal=GITLAB_TRIGGER_TOKEN="$GITLAB_TRIGGER_TOKEN" --from-literal=GITLAB_REF="$CI_DEFAULT_BRANCH" --dry-run=client -o yaml | kubectl apply -f -
    - 'sed "s|image: network-config:lab08|image: $CONFIG_IMAGE|" kubernetes/config-tier.yaml | kubectl apply -f -'
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/network-monitor-app --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/network-monitor-web --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status daemonset/filebeat --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" exec daemonset/filebeat -- sh -c 'find -L /var/log/containers -type f -print -quit | grep -q .'
    - kubectl -n "$KUBE_NAMESPACE" rollout status daemonset/metricbeat --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/kube-state-metrics --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/metricbeat-state --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/network-monitor-synthetic --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment/network-config --timeout=180s

verify-deployment:
  extends: .main-pipeline-job
  stage: verify
  environment: {name: course/minikube}
  resource_group: course-minikube
  script:
    - minikube update-context --profile network-devops
    - kubectl -n "$KUBE_NAMESPACE" wait --for=condition=Ready pod -l app=network-monitor --timeout=240s
    - kubectl -n "$KUBE_NAMESPACE" get deployment,statefulset,pods -o wide

post-deployment-web-test:
  extends: .main-pipeline-job
  stage: post-deployment-test
  environment: {name: course/minikube}
  resource_group: course-minikube
  script:
    - minikube update-context --profile network-devops
    - kubectl -n "$KUBE_NAMESPACE" port-forward service/network-monitor-web 18088:8080 > port-forward.log 2>&1 &
    - export PORT_FORWARD_PID=$!
    - trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT
    - for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18088/health && break; sleep 2; done
    - curl --fail --silent http://127.0.0.1:18088/health
    - curl --fail --silent http://127.0.0.1:18088/ | grep -F 'Network Operations Console'
    - curl --fail --silent http://127.0.0.1:18088/instance | grep -F '"instance":"network-monitor-web-'
    - curl --fail --silent http://127.0.0.1:18088/api/setup/status
    - kubectl -n "$KUBE_NAMESPACE" port-forward service/network-config 18089:8080 > config-port-forward.log 2>&1 &
    - export CONFIG_PORT_FORWARD_PID=$!
    - trap 'kill "$PORT_FORWARD_PID" "$CONFIG_PORT_FORWARD_PID" 2>/dev/null || true' EXIT
    - for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18089/health && break; sleep 2; done
    - curl --fail --silent http://127.0.0.1:18089/health | grep -F '"tier":"config"'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [port-forward.log, config-port-forward.log]

cleanup-minikube:
  stage: cleanup
  resource_group: course-minikube
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - minikube update-context --profile network-devops
    - export DB_PVC="mysql-data-network-monitor-db-0"
    - export DB_PV="$(kubectl -n "$KUBE_NAMESPACE" get pvc "$DB_PVC" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
    - |
      if kubectl -n "$KUBE_NAMESPACE" get statefulset network-monitor-db >/dev/null 2>&1; then
        kubectl -n "$KUBE_NAMESPACE" exec statefulset/network-monitor-db -- \
          sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "DROP DATABASE IF EXISTS network_monitor;"'
      fi
    - kubectl -n "$KUBE_NAMESPACE" delete statefulset network-monitor-db --ignore-not-found=true --wait=true --timeout=180s
    - kubectl -n "$KUBE_NAMESPACE" delete pvc "$DB_PVC" --ignore-not-found=true --wait=true --timeout=180s
    - kubectl delete namespace "$KUBE_NAMESPACE" --ignore-not-found=true --wait=true --timeout=300s
    - 'if [ -n "$DB_PV" ]; then kubectl delete pv "$DB_PV" --ignore-not-found=true --wait=true --timeout=180s; fi'
    - test -z "$(kubectl get namespace "$KUBE_NAMESPACE" -o name 2>/dev/null || true)"
    - test -z "$(kubectl get pv "$DB_PV" -o name 2>/dev/null || true)"
