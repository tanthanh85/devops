apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: network-monitor
      tier: app
  template:
    metadata:
      labels:
        app: network-monitor
        tier: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: network-monitor-app:lab08
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: LOG_LEVEL
              value: INFO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: DATABASE_URL
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: FLASK_SECRET_KEY
            - name: INVENTORY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: INVENTORY_ENCRYPTION_KEY
            - name: NETBOX_SKIP_TLS_VERIFY
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: NETBOX_SKIP_TLS_VERIFY
            - name: NETBOX_ROUTER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: NETBOX_ROUTER_USERNAME
            - name: NETBOX_ROUTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: NETBOX_ROUTER_PASSWORD
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                secretKeyRef:
                  name: network-monitor-runtime
                  key: SESSION_COOKIE_SECURE
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  selector:
    app: network-monitor
    tier: app
  ports:
    - name: http
      port: 8000
      targetPort: http
