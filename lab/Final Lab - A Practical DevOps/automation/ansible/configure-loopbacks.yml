---
- name: Configure NetBox loopbacks on IOS XE through RESTCONF
  hosts: routers
  gather_facts: false
  connection: ansible.netcommon.httpapi
  tasks:
    - name: Validate loopback input
      ansible.builtin.assert:
        that:
          - netbox_loopbacks | length > 0

    - name: Create or replace every NetBox loopback through RESTCONF
      ansible.netcommon.restconf_config:
        path: "/data/Cisco-IOS-XE-native:native/interface/Loopback={{ item.name | regex_replace('^Loopback', '') }}"
        method: put
        format: json
        content: >-
          {{
            {
              'Cisco-IOS-XE-native:Loopback': {
                'name': (item.name | regex_replace('^Loopback', '') | int),
                'ip': {
                  'address': {
                    'primary': {
                      'address': item.ip,
                      'mask': item.mask
                    }
                  }
                }
              }
            } | to_json
          }}
      loop: "{{ netbox_loopbacks }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip }} {{ item.mask }}"

    # restconf_config performs a GET before a write. IOS XE correctly rejects
    # GET on an RPC resource with 405, so invoke this POST-only RPC directly.
    - name: Save running configuration through the IOS XE RESTCONF RPC
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ ansible_port }}/restconf/operations/cisco-ia:save-config/"
        method: POST
        url_username: "{{ ansible_user }}"
        url_password: "{{ ansible_password }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Accept: application/yang-data+json
          Content-Type: application/yang-data+json
        body_format: json
        body: {}
        status_code: [200, 201, 204]
      delegate_to: localhost
