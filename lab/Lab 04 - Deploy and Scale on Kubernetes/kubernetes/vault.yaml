apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: network-devops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-monitor-app
  namespace: network-devops
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: network-devops
spec:
  selector: {app: vault}
  ports:
    - {name: http, port: 8200, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: network-devops
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.20.4
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: {secretKeyRef: {name: vault-bootstrap, key: token}}
          ports:
            - {name: http, containerPort: 8200}
          readinessProbe:
            httpGet: {path: "/v1/sys/health?standbyok=true", port: http}
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [IPC_LOCK], drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
