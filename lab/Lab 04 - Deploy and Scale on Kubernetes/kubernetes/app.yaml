apiVersion: v1
kind: Service
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  selector: {app: network-monitor, tier: application}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  replicas: 1
  selector:
    matchLabels: {app: network-monitor, tier: application}
  template:
    metadata:
      labels: {app: network-monitor, tier: application}
    spec:
      serviceAccountName: network-monitor-app
      containers:
        - name: app
          image: network-monitor-app:lab04
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: MYSQL_DATABASE
              valueFrom: {configMapKeyRef: {name: network-monitor-config, key: MYSQL_DATABASE}}
            - name: MYSQL_USER
              valueFrom: {configMapKeyRef: {name: network-monitor-config, key: MYSQL_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: MYSQL_PASSWORD}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: DATABASE_URL}}
            - name: FLASK_SECRET_KEY
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: FLASK_SECRET_KEY}}
            - {name: VAULT_ADDR, value: "http://vault:8200"}
            - {name: VAULT_KV_MOUNT, value: secret}
            - {name: VAULT_KUBERNETES_ROLE, value: network-monitor}
            - name: SESSION_COOKIE_SECURE
              valueFrom: {configMapKeyRef: {name: network-monitor-config, key: SESSION_COOKIE_SECURE}}
          volumeMounts:
            - {name: certificates, mountPath: /certificates, readOnly: true}
            - {name: temporary-files, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: certificates
          secret:
            secretName: router-ca
            optional: true
        - name: temporary-files
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
