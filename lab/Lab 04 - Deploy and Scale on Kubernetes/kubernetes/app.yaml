apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-monitor
      tier: app
  template:
    metadata:
      labels:
        app: network-monitor
        tier: app
    spec:
      containers:
        - name: app
          image: network-monitor-app:lab04
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: network-monitor-runtime
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: network-monitor-app
  namespace: network-devops
spec:
  selector:
    app: network-monitor
    tier: app
  ports:
    - name: http
      port: 8000
      targetPort: http
