apiVersion: v1
kind: Service
metadata:
  name: network-monitor-web
  namespace: network-devops
spec:
  type: NodePort
  selector: {app: network-monitor, tier: web}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-monitor-web
  namespace: network-devops
spec:
  replicas: 1
  selector:
    matchLabels: {app: network-monitor, tier: web}
  template:
    metadata:
      labels: {app: network-monitor, tier: web}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: web
          image: network-monitor-web:lab04
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: run, mountPath: /var/run}
            - {name: cache, mountPath: /var/cache/nginx}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
        - {name: cache, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
