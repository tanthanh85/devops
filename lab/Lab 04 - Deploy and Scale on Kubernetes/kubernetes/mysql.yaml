apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: network-devops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: network-devops
spec:
  selector: {app: network-monitor, tier: database}
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: network-devops
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: network-monitor, tier: database}
  template:
    metadata:
      labels: {app: network-monitor, tier: database}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - name: MYSQL_DATABASE
              valueFrom: {configMapKeyRef: {name: network-monitor-config, key: MYSQL_DATABASE}}
            - name: MYSQL_USER
              valueFrom: {configMapKeyRef: {name: network-monitor-config, key: MYSQL_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: MYSQL_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: network-monitor-secrets, key: MYSQL_ROOT_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
          startupProbe:
            exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
