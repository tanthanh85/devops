log_format observability escape=json '{'
  '"@timestamp":"$time_iso8601",'
  '"message":"web request completed",'
  '"service.name":"network-monitor-web",'
  '"service.type":"web",'
  '"event.dataset":"network_monitor.web",'
  '"event.action":"http_request",'
  '"container.name":"$hostname",'
  '"kubernetes.pod.ip":"$server_addr",'
  '"http.request.method":"$request_method",'
  '"http.response.status_code":$status,'
  '"http.response.body.bytes":$body_bytes_sent,'
  '"url.path":"$uri",'
  '"http.request.duration_seconds":$request_time,'
  '"upstream.response.duration_seconds":"$upstream_response_time",'
  '"client.address":"$remote_addr",'
  '"user_agent.original":"$http_user_agent"'
'}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout observability;
  error_log /dev/stderr warn;

  location = /health { access_log off; return 200 "healthy\n"; }
  location = /instance {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Connection "close" always;
    return 200 '{"container_name":"$hostname","ip_address":"$server_addr"}';
  }
  location /api/ {
    proxy_pass http://network-monitor-app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
}
