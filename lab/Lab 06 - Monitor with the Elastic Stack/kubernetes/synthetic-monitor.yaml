apiVersion: batch/v1
kind: CronJob
metadata: {name: network-monitor-synthetic, namespace: network-devops-lab05}
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: {app: network-monitor-synthetic, tier: test}
        spec:
          restartPolicy: Never
          containers:
            - name: synthetic-monitor
              image: network-monitor-synthetic:lab06
              imagePullPolicy: IfNotPresent
              env:
                - {name: HOME, value: /tmp}
                - {name: TEST_BASE_URL, value: "http://network-monitor-web:8080"}
                - {name: E2E_USERNAME, valueFrom: {secretKeyRef: {name: synthetic-monitor-credentials, key: username}}}
                - {name: E2E_PASSWORD, valueFrom: {secretKeyRef: {name: synthetic-monitor-credentials, key: password}}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: temporary-files, mountPath: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
          volumes:
            - name: temporary-files
              emptyDir: {medium: Memory, sizeLimit: 256Mi}
