input {
  beats { port => 5044 }
}

filter {
  if [message] =~ /^\s*\{/ {
    json { source => "message" skip_on_invalid_json => true }
  }
  mutate {
    add_field => { "observer.type" => "course-elastic-stack" }
  }
}

output {
  if [event.dataset] == "network_monitor.synthetic" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-monitor-synthetic-%{+YYYY.MM.dd}" }
  } else if [event.dataset] =~ /^network_monitor\./ {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-monitor-logs-%{+YYYY.MM.dd}" }
  } else if [event][module] == "docker" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "infrastructure-metrics-%{+YYYY.MM.dd}" }
  } else if [event][dataset] =~ /^kubernetes\./ {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-metrics-%{+YYYY.MM.dd}" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-logs-%{+YYYY.MM.dd}" }
  }
}
