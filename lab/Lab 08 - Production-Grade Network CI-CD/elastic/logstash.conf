input {
  beats { port => 5044 }
  http {
    port => 8081
    codec => json
    response_code => 202
  }
}
filter {
  if [message] =~ /^\s*\{/ { json { source => "message" skip_on_invalid_json => true } }
  mutate { add_field => { "observer.type" => "course-elastic-stack" } }
}
output {
  if [event.dataset] == "network_cicd.audit" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-cicd-audit-%{+YYYY.MM.dd}" }
  } else if [event.dataset] == "network_monitor.synthetic" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-monitor-synthetic-%{+YYYY.MM.dd}" }
  } else if [event.dataset] =~ /^network_(monitor|automation)\./ {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "network-automation-logs-%{+YYYY.MM.dd}" }
  } else if [event][dataset] == "netbox.container" {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "netbox-logs-%{+YYYY.MM.dd}" }
  } else if [event][dataset] =~ /^kubernetes\./ {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-metrics-%{+YYYY.MM.dd}" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "kubernetes-logs-%{+YYYY.MM.dd}" }
  }
}
