services:
  netbox:
    ports:
      - "${NETBOX_LISTEN_ADDRESS:-127.0.0.1}:8000:8080"
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.2.3
    user: root
    command: ["-e", "-c", "/etc/filebeat.yml"]
    environment:
      LOGSTASH_HOST: ${LOGSTASH_HOST:-host.docker.internal:5044}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./filebeat.yml:/etc/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbox_filebeat_data:/usr/share/filebeat/data

volumes:
  netbox_filebeat_data:
