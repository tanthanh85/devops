apiVersion: v1
kind: Service
metadata: {name: alert-webhook, namespace: network-devops}
spec:
  type: NodePort
  selector: {app: alert-webhook}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30089}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alert-webhook, namespace: network-devops}
spec:
  replicas: 1
  selector: {matchLabels: {app: alert-webhook}}
  template:
    metadata: {labels: {app: alert-webhook}}
    spec:
      containers:
        - name: receiver
          image: alert-webhook:lab07
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: WEBHOOK_TOKEN, valueFrom: {secretKeyRef: {name: alert-webhook-token, key: token}}}
            - {name: MAX_EVENTS, value: "200"}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}]
