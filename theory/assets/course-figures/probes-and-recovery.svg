<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="400" viewBox="0 0 1184 400"><rect width="100%" height="100%" fill="white"/><style>.label{font:700 18px Arial,sans-serif;fill:#102f55}.sub{font:400 14px Arial,sans-serif;fill:#597089}.band{font:700 16px Arial,sans-serif;fill:#102f55}.small{font:600 14px Arial,sans-serif;fill:#102f55}</style><rect x="28" y="38" width="361.3333333333333" height="250" rx="15" fill="#fff6e9" stroke="#f28a22" stroke-width="2"/><text x="208.66666666666666" y="73" text-anchor="middle" class="label">Startup probe</text><circle cx="66" cy="112" r="18" fill="#f28a22"/><g transform="translate(56 102) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 14v-4"/><path d="M4 13a8 8 0 0 1 8-7 8 8 0 1 1-5.3 14L4 17.6"/><path d="M9 17H4v5"/></g><text x="96" y="117" text-anchor="start" class="small">Allow slow initialization</text><circle cx="66" cy="164" r="18" fill="#f28a22"/><g transform="translate(56 154) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/></g><text x="96" y="169" text-anchor="start" class="small">Delay other probe decisions</text><rect x="411.3333333333333" y="38" width="361.3333333333333" height="250" rx="15" fill="#eef6fc" stroke="#0878c9" stroke-width="2"/><text x="592" y="73" text-anchor="middle" class="label">Readiness probe</text><circle cx="449.3333333333333" cy="112" r="18" fill="#0878c9"/><g transform="translate(439.3333333333333 102) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></g><text x="479.3333333333333" y="117" text-anchor="start" class="small">Control traffic eligibility</text><circle cx="449.3333333333333" cy="164" r="18" fill="#0878c9"/><g transform="translate(439.3333333333333 154) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></g><text x="479.3333333333333" y="169" text-anchor="start" class="small">Recover without restart</text><rect x="794.6666666666666" y="38" width="361.3333333333333" height="250" rx="15" fill="#fff0f0" stroke="#dc4c4c" stroke-width="2"/><text x="975.3333333333333" y="73" text-anchor="middle" class="label">Liveness probe</text><circle cx="832.6666666666666" cy="112" r="18" fill="#dc4c4c"/><g transform="translate(822.6666666666666 102) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g><text x="862.6666666666666" y="117" text-anchor="start" class="small">Restart a stuck process</text><circle cx="832.6666666666666" cy="164" r="18" fill="#dc4c4c"/><g transform="translate(822.6666666666666 154) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="862.6666666666666" y="169" text-anchor="start" class="small">Avoid dependency-based loops</text><rect x="28" y="315" width="1128" height="58" rx="9" fill="#dff2ff"/><text x="592" y="351" text-anchor="middle" class="band">A probe is a control decision; each probe must answer a different question.</text></svg>